---
# Domain-wide password policy for lab.local (Default Domain Policy).
# Enforces the strongest rules native AD supports:
#   - min length 16
#   - complexity ON  (upper + lower + digit + special; 3 of 4 categories
#                     AND password may not contain the account/display name)
#   - 24 remembered passwords (no reuse across a user's own history)
#   - no password expiry: one password stays valid until it's changed
#     (min age 0 / max age 0 = never expires)
#
# Account lockout:
#   - lock after 5 bad attempts
#   - stay locked 30 min, counter resets after 30 min
- name: Enforce domain password policy on lab.local
  hosts: dc
  gather_facts: false
  tasks:
    - name: Apply Default Domain Password Policy
      ansible.windows.win_shell: |
        Set-ADDefaultDomainPasswordPolicy -Identity "{{ domain_dns_name }}" `
          -MinPasswordLength 16 `
          -ComplexityEnabled $true `
          -PasswordHistoryCount 24 `
          -MinPasswordAge (New-TimeSpan -Days 0) `
          -MaxPasswordAge (New-TimeSpan -Days 0) `
          -ReversibleEncryptionEnabled $false
      register: setpol
      changed_when: setpol.rc == 0

    - name: Apply account lockout policy (5 bad attempts)
      ansible.windows.win_shell: |
        Set-ADDefaultDomainPasswordPolicy -Identity "{{ domain_dns_name }}" `
          -LockoutThreshold 5 `
          -LockoutDuration (New-TimeSpan -Minutes 30) `
          -LockoutObservationWindow (New-TimeSpan -Minutes 30)
      register: setlock
      changed_when: setlock.rc == 0

    - name: Read back the effective policy
      ansible.windows.win_shell: |
        Get-ADDefaultDomainPasswordPolicy |
          Select-Object MinPasswordLength, ComplexityEnabled,
                        PasswordHistoryCount, MinPasswordAge, MaxPasswordAge,
                        ReversibleEncryptionEnabled,
                        LockoutThreshold, LockoutDuration, LockoutObservationWindow |
          Format-List | Out-String
      register: showpol
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        var: showpol.stdout_lines
