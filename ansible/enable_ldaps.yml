---
# Give dc01 an LDAPS certificate so tools that require LDAPS (BloodHound
# collectors, and any client that won't do sealed LDAP over 389) can bind
# over 636. Server 2025 enforces LDAP signing; without a server-auth cert the
# LDAPS listener resets the TLS handshake ("Connection reset by peer"), which
# is what breaks bloodhound-python / SharpHound collection.
#
# This creates a self-signed cert (fine for an isolated lab) in
# LocalMachine\My with the DC FQDN as subject + SAN and the Server
# Authentication EKU, which is all Schannel/NTDS needs to serve LDAPS.
# Idempotent: re-running reuses the existing cert if one is already present.
- name: Enable LDAPS on dc01 with a self-signed certificate
  hosts: dc
  gather_facts: false
  tasks:
    - name: Discover the DC fully-qualified DNS name
      ansible.windows.win_shell: '[System.Net.Dns]::GetHostByName($env:COMPUTERNAME).HostName'
      register: dc_fqdn
      changed_when: false

    - name: Create a self-signed Server Authentication cert for LDAPS (if absent)
      ansible.windows.win_shell: |
        $fqdn = "{{ dc_fqdn.stdout | trim }}"
        $existing = Get-ChildItem Cert:\LocalMachine\My |
          Where-Object {
            $_.Subject -eq "CN=$fqdn" -and
            $_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.1' -and
            $_.NotAfter -gt (Get-Date)
          }
        if ($existing) {
          "LDAPS cert already present: $($existing.Thumbprint)"
        } else {
          $c = New-SelfSignedCertificate -Subject "CN=$fqdn" -DnsName $fqdn `
                 -CertStoreLocation Cert:\LocalMachine\My `
                 -KeyExportPolicy Exportable -KeySpec KeyExchange `
                 -KeyUsage DigitalSignature,KeyEncipherment `
                 -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.1') `
                 -NotAfter (Get-Date).AddYears(5)
          "added LDAPS cert: $($c.Thumbprint)"
        }
      register: ldaps_cert
      changed_when: "'added LDAPS cert' in ldaps_cert.stdout"

    - name: Trust the self-signed cert (LocalMachine\Root) so Schannel accepts it
      # Without this, Schannel logs event 36886 ("no suitable default server
      # credential") and the LDAPS TLS handshake resets — because a self-signed
      # cert whose chain doesn't validate is not offered as a server credential.
      # Copying it into the machine Trusted Root store makes the chain valid.
      ansible.windows.win_shell: |
        $fqdn = "{{ dc_fqdn.stdout | trim }}"
        $cert = Get-ChildItem Cert:\LocalMachine\My |
          Where-Object { $_.Subject -eq "CN=$fqdn" -and
                         $_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.1' -and
                         $_.NotAfter -gt (Get-Date) } |
          Sort-Object NotAfter -Descending | Select-Object -First 1
        $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root","LocalMachine")
        $store.Open("ReadWrite")
        if (-not ($store.Certificates | Where-Object Thumbprint -eq $cert.Thumbprint)) {
          $store.Add($cert)
          "trusted cert $($cert.Thumbprint)"
        } else {
          "cert already trusted"
        }
        $store.Close()
      register: ldaps_trust
      changed_when: "'trusted cert' in ldaps_trust.stdout"

    - name: Restart NTDS so the LDAPS listener rebinds the certificate
      # renewServerCertificate rootDSE op is unreliable on Server 2025 (needs
      # elevated LDAP bind and doesn't always rebind); a service restart makes
      # NTDS re-read the cert stores deterministically. Run it whenever the cert
      # was just created or newly trusted, so a partial prior run self-heals.
      ansible.windows.win_shell: |
        Restart-Service NTDS -Force
        Start-Sleep -Seconds 8
        $svc = Get-Service NTDS
        if ($svc.Status -ne 'Running') { throw ('NTDS did not return to Running: ' + $svc.Status) }
        $filter = @{ LogName = 'System'; ProviderName = 'Schannel'; Id = 36886; StartTime = (Get-Date).AddMinutes(-1) }
        $err = Get-WinEvent -FilterHashtable $filter -ErrorAction SilentlyContinue
        $count = @($err).Count
        Write-Output ('NTDS restarted; status=' + $svc.Status + '; new Schannel 36886 errors=' + $count)
      register: ntds_reload
      changed_when: true
      when: >-
        ('added LDAPS cert' in ldaps_cert.stdout) or
        ('trusted cert' in ldaps_trust.stdout)

    - name: Report
      ansible.builtin.debug:
        msg:
          - "{{ ldaps_cert.stdout | trim }}"
          - "{{ ldaps_trust.stdout | trim }}"
          - "{{ ntds_reload.stdout | default('NTDS restart skipped (already configured)') | trim }}"
